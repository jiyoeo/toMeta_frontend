<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.1/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css"
    />
    <title>ToMeta</title>
    <script>
      (function () {
        function setExplicitHeight() {
          var h =
            window.innerHeight > 0
              ? window.innerHeight
              : window.screen.availHeight || window.screen.height || 800;
          document.documentElement.style.height = h + 'px';
        }
        setExplicitHeight();
        window.addEventListener('resize', setExplicitHeight);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
